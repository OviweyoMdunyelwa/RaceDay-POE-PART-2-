name: RaceDay Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore API
        run: dotnet restore RaceDay.API/RaceDay.API.csproj

      - name: Restore Tests
        run: dotnet restore RaceDay.API.Tests/RaceDay.API.Tests.csproj

      - name: Restore Web
        run: dotnet restore RaceDay.Web/RaceDay.Web.csproj

      - name: Build API
        run: dotnet build RaceDay.API/RaceDay.API.csproj --no-restore --configuration Release

      - name: Build Tests
        run: dotnet build RaceDay.API.Tests/RaceDay.API.Tests.csproj --no-restore --configuration Release

      - name: Build Web
        run: dotnet build RaceDay.Web/RaceDay.Web.csproj --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet test RaceDay.API.Tests/RaceDay.API.Tests.csproj --no-build --configuration Release
